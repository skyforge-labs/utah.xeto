# Auto-tag on push to main when buildVersion changes
# Reads version from build.props, compares to existing tags
name: Auto Tag

on:
  push:
    branches: [main]

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for tag comparison

      - name: Check version and tag
        run: |
          # Read buildVersion from build.props
          version=$(grep -oP 'buildVersion=\K.*' build.props | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "No buildVersion found in build.props"
            exit 1
          fi

          tag="v${version}"
          echo "Current version: ${version}"
          echo "Expected tag: ${tag}"

          # Check if tag already exists
          if git tag -l "$tag" | grep -q "$tag"; then
            echo "Tag ${tag} already exists, skipping"
          else
            echo "Creating tag ${tag}"
            git tag "$tag"
            git push origin "$tag"
          fi
