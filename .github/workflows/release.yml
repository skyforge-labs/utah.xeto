# Auto-release on push to main. Single source of truth: versions.json.
# Copy to any repo; for monorepos set env PROJECT_ROOT (e.g. Clients/utah).
# See .github/RELEASE-PLAN.md for versioning design.
name: Release

on:
  push:
    branches: [main]
    paths:
      - "Clients/utah/versions.json"
      - "Clients/utah/lib/**"
      - "Clients/utah/build.props"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Single-repo: use ".". Monorepo: set to project subdir (here: Clients/utah).
      PROJECT_ROOT: "Clients/utah"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set project root
        id: root
        run: |
          ROOT="${{ env.PROJECT_ROOT }}"
          [ -z "$ROOT" ] && ROOT="."
          if [ ! -f "$ROOT/versions.json" ]; then
            echo "::error::versions.json not found at $ROOT/versions.json (set PROJECT_ROOT for monorepos)"
            exit 1
          fi
          echo "root=$ROOT" >> $GITHUB_OUTPUT

      - name: Check version (from versions.json only)
        id: version
        run: |
          ROOT="${{ steps.root.outputs.root }}"
          if [ ! -f "$ROOT/versions.json" ]; then
            echo "::error::versions.json not found at $ROOT/versions.json"
            exit 1
          fi
          version=$(jq -r '.buildVersion // empty' "$ROOT/versions.json" | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "::error::buildVersion missing in versions.json"
            exit 1
          fi
          tag="v${version}"
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "tag=${tag}" >> $GITHUB_OUTPUT

          if gh release view "$tag" &>/dev/null; then
            echo "Release ${tag} already exists, skipping"
            echo "new=false" >> $GITHUB_OUTPUT
          else
            echo "Version ${version} needs release"
            echo "new=true" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Tag version
        if: steps.version.outputs.new == 'true'
        run: |
          if ! git ls-remote --tags origin | grep -q "refs/tags/${{ steps.version.outputs.tag }}$"; then
            git tag ${{ steps.version.outputs.tag }}
            git push origin ${{ steps.version.outputs.tag }}
          else
            echo "Tag already exists, skipping tag creation"
          fi

      - name: Package release assets (from versions.json only)
        if: steps.version.outputs.new == 'true'
        run: |
          ROOT="${{ steps.root.outputs.root }}"
          VERSIONS="$ROOT/versions.json"
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"

          mkdir -p dist

          # Copy versions.json
          cp "$VERSIONS" dist/versions.json

          # ── Fantom pods: one .pod per entry in versions.json ──
          for name in $(jq -r '.pods[]?.name // empty' "$VERSIONS"); do
            [ -z "$name" ] && continue
            pod_file="$ROOT/lib/fan/${name}.pod"
            [ -f "$pod_file" ] || continue
            cp "$pod_file" "dist/"
          done

          # ── Xeto libs: one .xetolib per entry in versions.json ──
          for name in $(jq -r '.libs[]?.name // empty' "$VERSIONS"); do
            [ -z "$name" ] && continue
            lib_ver=$(jq -r --arg n "$name" '.libs[] | select(.name == $n) | .version // empty' "$VERSIONS")
            [ -z "$lib_ver" ] && lib_ver="$version"
            lib_dir="$ROOT/lib/xeto/${name}"
            [ -d "$lib_dir" ] || continue
            xetolib_name="${name}-${lib_ver}.xetolib"
            existing=$(find "$lib_dir" -maxdepth 1 -name "*.xetolib" | head -1)
            if [ -n "$existing" ]; then
              cp "$existing" "dist/${xetolib_name}"
            else
              if [ "$ROOT" = "." ]; then dist_up="../../.."; else dist_up="../../../.."; fi
              (cd "$lib_dir" && zip -r "${dist_up}/dist/${xetolib_name}" .)
            fi
          done

          # all.zip: all .pod, all .xetolib, versions.json
          (cd dist && zip -r "all.zip" . -x "all.zip")

          echo ""
          echo "=== dist contents ==="
          ls -la dist/

      - name: Create GitHub Release
        if: steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: dist/*
          generate_release_notes: true
