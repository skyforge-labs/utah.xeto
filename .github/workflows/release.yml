# Auto-release on push to main
# buildVersion in build.props triggers release; per-artifact versions from versions.json
# Pre-commit hook generates versions.json from build.fan + lib.xeto sources
name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version
        id: version
        run: |
          version=$(grep -oP 'buildVersion=\K.*' build.props | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "No buildVersion found in build.props"
            exit 1
          fi
          tag="v${version}"
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "tag=${tag}" >> $GITHUB_OUTPUT

          if gh release view "$tag" &>/dev/null; then
            echo "Release ${tag} already exists, skipping"
            echo "new=false" >> $GITHUB_OUTPUT
          else
            echo "Version ${version} needs release"
            echo "new=true" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Validate versions.json
        if: steps.version.outputs.new == 'true'
        run: |
          if [ ! -f versions.json ]; then
            echo "::warning::versions.json not found — all artifacts will use buildVersion."
            echo "Run pre-commit hook to generate versions.json from source."
          else
            echo "versions.json:"
            cat versions.json
          fi

      - name: Tag version
        if: steps.version.outputs.new == 'true'
        run: |
          if ! git ls-remote --tags origin | grep -q "refs/tags/${{ steps.version.outputs.tag }}$"; then
            git tag ${{ steps.version.outputs.tag }}
            git push origin ${{ steps.version.outputs.tag }}
          else
            echo "Tag already exists, skipping tag creation"
          fi

      - name: Package release assets
        if: steps.version.outputs.new == 'true'
        run: |
          mkdir -p dist
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"
          echo "" > release_notes.md

          # ── Fantom pods ──
          has_pods=false
          for pod in lib/fan/*.pod; do
            [ -f "$pod" ] || continue
            if [ "$has_pods" = false ]; then
              echo "## Fantom Pods" >> release_notes.md
              echo "" >> release_notes.md
              has_pods=true
            fi
            pod_name=$(basename "$pod" .pod)

            pod_ver=""
            if [ -f versions.json ]; then
              pod_ver=$(jq -r --arg n "$pod_name" \
                '.pods[] | select(.name == $n) | .version // empty' versions.json 2>/dev/null)
            fi
            pod_ver="${pod_ver:-$version}"

            cp "$pod" dist/
            echo "- **${pod_name}** v${pod_ver}" >> release_notes.md
          done

          if [ "$has_pods" = true ]; then
            (cd dist && zip "fantom-pods-${tag}.zip" *.pod)
            echo "" >> release_notes.md
          fi

          # ── Xeto libraries ──
          has_libs=false
          generated_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          index_libs=""

          for lib_dir in lib/xeto/*/; do
            [ -d "$lib_dir" ] || continue
            if [ "$has_libs" = false ]; then
              echo "## Xeto Libraries" >> release_notes.md
              echo "" >> release_notes.md
              has_libs=true
            fi
            lib_name=$(basename "$lib_dir")

            lib_ver=""
            if [ -f versions.json ]; then
              lib_ver=$(jq -r --arg n "$lib_name" \
                '.libs[] | select(.name == $n) | .version // empty' versions.json 2>/dev/null)
            fi
            lib_ver="${lib_ver:-$version}"

            xetolib_name="${lib_name}-${lib_ver}.xetolib"

            existing=$(find "$lib_dir" -maxdepth 1 -name "*.xetolib" | head -1)
            if [ -n "$existing" ]; then
              cp "$existing" "dist/${xetolib_name}"
            else
              (cd "$lib_dir" && zip -r "../../../dist/${xetolib_name}" .)
            fi

            [ -n "$index_libs" ] && index_libs="${index_libs},"
            index_libs="${index_libs}{\"name\":\"${lib_name}\",\"stable\":\"${lib_ver}\"}"

            echo "- **${lib_name}** v${lib_ver}" >> release_notes.md
          done

          echo "{\"generatedAt\":\"${generated_at}\",\"libs\":[${index_libs}]}" \
            | python3 -m json.tool > dist/xeto-index.json

          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "**Release:** \`${tag}\`" >> release_notes.md

          echo ""
          echo "=== dist contents ==="
          ls -la dist/

      - name: Create GitHub Release
        if: steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: dist/*
          body_path: release_notes.md
          generate_release_notes: true
