# Auto-release on push to main when buildVersion changes
# Reads version from build.props, tags if new, releases lib/
# Produces: .xetolib + .sha256 files, xeto-index.json
name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version
        id: version
        run: |
          version=$(grep -oP 'buildVersion=\K.*' build.props | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "No buildVersion found in build.props"
            exit 1
          fi
          tag="v${version}"
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "tag=${tag}" >> $GITHUB_OUTPUT

          if git tag -l "$tag" | grep -q "$tag"; then
            echo "Tag ${tag} already exists, skipping release"
            echo "new=false" >> $GITHUB_OUTPUT
          else
            echo "New version ${version} detected"
            echo "new=true" >> $GITHUB_OUTPUT
          fi

      - name: Tag version
        if: steps.version.outputs.new == 'true'
        run: |
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Package release assets
        if: steps.version.outputs.new == 'true'
        run: |
          mkdir -p dist
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"

          echo "## Xeto Libraries" > release_notes.md
          echo "" >> release_notes.md

          # --- Xeto libs as .xetolib + .sha256 ---
          # Start xeto-index.json
          generated_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          index_libs=""

          for lib_dir in lib/xeto/*/; do
            [ -d "$lib_dir" ] || continue
            lib_name=$(basename "$lib_dir")

            # Package as .xetolib (zip with different extension)
            xetolib_name="${lib_name}-${version}.xetolib"
            (cd "$lib_dir" && zip -r "../../../dist/${xetolib_name}" .)

            # Generate SHA-256 checksum
            sha256_name="${lib_name}-${version}.sha256"
            (cd dist && sha256sum "$xetolib_name" > "$sha256_name")

            # Append to index
            if [ -n "$index_libs" ]; then index_libs="${index_libs},"; fi
            index_libs="${index_libs}{\"name\":\"${lib_name}\",\"stable\":\"${version}\"}"

            echo "- **${lib_name}** v${version}" >> release_notes.md
          done

          # Write xeto-index.json
          echo "{\"generatedAt\":\"${generated_at}\",\"libs\":[${index_libs}]}" \
            | python3 -m json.tool > dist/xeto-index.json

      - name: Create GitHub Release
        if: steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: dist/*
          body_path: release_notes.md
          generate_release_notes: true
