# Auto-release on push to main. Single source of truth: versions.json.
# One tag+release per version referenced by pods/libs.
# Assumes versions.json is at repo root.
# See .github/RELEASE-PLAN.md for versioning design.
name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check versions.json changed in push
        id: versions_changed
        run: |
          TARGET="versions.json"
          before="${{ github.event.before }}"
          after="${{ github.sha }}"

          # New branch or first push: treat versions.json as changed if it exists.
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            if [ -f "$TARGET" ]; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
            exit 0
          fi

          if git diff --name-only "$before" "$after" | grep -q "^${TARGET}$"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Release per version (from versions.json only)
        run: |
          set -euo pipefail
          ROOT="."
          VERSIONS="versions.json"
          changed="${{ steps.versions_changed.outputs.changed }}"

          if [ ! -f "$VERSIONS" ]; then
            echo "::error::versions.json not found at ./versions.json"
            exit 1
          fi

          build_version=$(jq -r '.buildVersion // empty' "$VERSIONS" | tr -d '[:space:]')
          if [ -z "$build_version" ]; then
            echo "::error::buildVersion missing in versions.json"
            exit 1
          fi

          if [ "$changed" != "true" ]; then
            echo "versions.json unchanged in this push; checking for missing releases anyway."
          fi

          # Build item list with resolved version (fallback to buildVersion).
          items_json=$(jq -c --arg bv "$build_version" '
            [
              (.pods[]? | {type:"pod", name, version:(.version // $bv)}),
              (.libs[]? | {type:"lib", name, version:(.version // $bv)})
            ]
          ' "$VERSIONS")

          versions=$(echo "$items_json" | jq -r 'map(.version) | unique[]')
          if [ -z "$versions" ]; then
            echo "No pods/libs in versions.json; nothing to release."
            exit 0
          fi

          for version in $versions; do
            tag="v${version}"

            if gh release view "$tag" &>/dev/null; then
              echo "Release ${tag} already exists, skipping"
              continue
            fi

            # Ensure tag exists remotely before creating release.
            if ! git ls-remote --tags origin | grep -q "refs/tags/${tag}$"; then
              git tag "$tag"
              git push origin "$tag"
            else
              echo "Tag ${tag} already exists, skipping tag creation"
            fi

            dist_dir="dist/${tag}"
            mkdir -p "$dist_dir"

            # Include versions.json in every per-version release.
            cp "$VERSIONS" "$dist_dir/versions.json"

            # Pods for this version.
            pod_names=$(echo "$items_json" | jq -r --arg v "$version" '.[] | select(.type=="pod" and .version==$v) | .name')
            for name in $pod_names; do
              pod_file="$ROOT/lib/fan/${name}.pod"
              [ -f "$pod_file" ] || continue
              cp "$pod_file" "$dist_dir/"
            done

            # Libs for this version.
            lib_names=$(echo "$items_json" | jq -r --arg v "$version" '.[] | select(.type=="lib" and .version==$v) | .name')
            for name in $lib_names; do
              lib_dir="$ROOT/lib/xeto/${name}"
              [ -d "$lib_dir" ] || continue
              xetolib_name="${name}-${version}.xetolib"
              preferred="${lib_dir}/${xetolib_name}"
              if [ -f "$preferred" ]; then
                cp "$preferred" "$dist_dir/${xetolib_name}"
              else
                existing=$(ls "$lib_dir"/*.xetolib 2>/dev/null | head -n 1 || true)
                if [ -n "$existing" ]; then
                  cp "$existing" "$dist_dir/${xetolib_name}"
                else
                  (cd "$lib_dir" && zip -r "$GITHUB_WORKSPACE/$dist_dir/${xetolib_name}" .)
                fi
              fi
            done

            # all.zip: all assets for this version (plus versions.json)
            (cd "$dist_dir" && zip -r "all.zip" . -x "all.zip")

            echo "Creating release ${tag}..."
            gh release create "$tag" "$dist_dir"/* --generate-notes
          done
        env:
          GH_TOKEN: ${{ github.token }}
