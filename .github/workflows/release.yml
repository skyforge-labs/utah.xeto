# Auto-release on push to main based on buildVersion
# Reads version from build.props, tags if needed, releases lib/
# Produces: .xetolib + .sha256 files, xeto-index.json
name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version
        id: version
        run: |
          version=$(grep -oP 'buildVersion=\K.*' build.props | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "No buildVersion found in build.props"
            exit 1
          fi
          tag="v${version}"
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "tag=${tag}" >> $GITHUB_OUTPUT

          # Check if a RELEASE (not just tag) already exists
          if gh release view "$tag" &>/dev/null; then
            echo "Release ${tag} already exists, skipping"
            echo "new=false" >> $GITHUB_OUTPUT
          else
            echo "Version ${version} needs release"
            echo "new=true" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Tag version
        if: steps.version.outputs.new == 'true'
        run: |
          # Create tag only if it doesn't exist yet
          if ! git ls-remote --tags origin | grep -q "refs/tags/${{ steps.version.outputs.tag }}$"; then
            git tag ${{ steps.version.outputs.tag }}
            git push origin ${{ steps.version.outputs.tag }}
          else
            echo "Tag already exists, skipping tag creation"
          fi

      - name: Package release assets
        if: steps.version.outputs.new == 'true'
        run: |
          mkdir -p dist
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"

          echo "## Xeto Libraries" > release_notes.md
          echo "" >> release_notes.md

          # --- Xeto libs: handle pre-built .xetolib OR source dirs ---
          generated_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          index_libs=""

          for lib_dir in lib/xeto/*/; do
            [ -d "$lib_dir" ] || continue
            lib_name=$(basename "$lib_dir")
            xetolib_name="${lib_name}-${version}.xetolib"

            # Check if dir contains a pre-built .xetolib file
            existing=$(find "$lib_dir" -maxdepth 1 -name "*.xetolib" | head -1)
            if [ -n "$existing" ]; then
              cp "$existing" "dist/${xetolib_name}"
              echo "Copied pre-built: $existing -> dist/${xetolib_name}"
            else
              (cd "$lib_dir" && zip -r "../../../dist/${xetolib_name}" .)
              echo "Zipped source: $lib_dir -> dist/${xetolib_name}"
            fi

            # Append to index
            if [ -n "$index_libs" ]; then index_libs="${index_libs},"; fi
            index_libs="${index_libs}{\"name\":\"${lib_name}\",\"stable\":\"${version}\"}"

            echo "- **${lib_name}** v${version}" >> release_notes.md
          done

          # Write xeto-index.json
          echo "{\"generatedAt\":\"${generated_at}\",\"libs\":[${index_libs}]}" \
            | python3 -m json.tool > dist/xeto-index.json

          echo ""
          echo "=== dist contents ==="
          ls -la dist/

      - name: Create GitHub Release
        if: steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: dist/*
          body_path: release_notes.md
          generate_release_notes: true
