name: Build and release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check tag matches library version
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os
          from pathlib import Path
          props = dict(line.split('=', 1) for line in Path('build.props').read_text().splitlines() if '=' in line)
          assert os.environ['GITHUB_REF_NAME'] == 'v' + props['utah.version'], 'Tag/version mismatch'
      - name: Test build failure handling
        run: python -m unittest discover -s tests -v
      - name: Compile, test installed libraries, and package
        run: python scripts/build.py --package
      - uses: actions/upload-artifact@v4
        with:
          name: utah-xeto-${{ matrix.os }}
          path: dist/v*/
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: utah-xeto-ubuntu-latest
          path: release
      - name: Publish the verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag \
            --title "Utah Xeto $GITHUB_REF_NAME — SkySpark 4" \
            --notes-file RELEASE-NOTES.md
